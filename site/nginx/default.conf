map $cookie_lang $lang_from_cookie {
    default "";
    en      "en";
    it      "it";
}

map $http_accept_language $lang_from_header {
    default           "en";
    ~*^it             "it";
    ~*^en             "en";
}

map $lang_from_cookie $prefer_lang {
    default $lang_from_header;
    en      "en";
    it      "it";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Language landing (relative — keeps host port when published as :8090)
    location = / {
        return 302 /$prefer_lang/;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
