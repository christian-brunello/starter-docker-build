# Keep Pulse runtime dir traversable by container user "starter" (uid 999)
# after Pulse recreates sockets. Cookie staging is root-only via
# starter-pulse-access.path / ensure-pulse-access.sh (user cannot write
# /run/starter-pulse owned by root).
#
# Install: sudo ./scripts/apply-pulse-host.sh
# (also called from install-systemd.sh)

[Service]
# %U = numeric UID for user units.
# chmod only here — full ensure (cookie) runs as root from the path unit.
ExecStartPost=-/bin/chmod 755 /run/user/%U/pulse
