services:
  mysql-server:
    image: mysql:8.0
    container_name: mysql-server
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_RACK_PASSWORD: ${MYSQL_RACK_PASSWORD:-}
      MYSQL_DATABASE: compute_rack
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ${MYSQL_DATA_DIR:?set MYSQL_DATA_DIR}:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./02-rack-user.sh:/docker-entrypoint-initdb.d/02-rack-user.sh:ro
    networks:
      - default
      - rack-net
    command:
      - --default-authentication-plugin=mysql_native_password

networks:
  rack-net:
    external: true
